name: Desktop installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win --x64
            executable: desktop-dist/win-unpacked/Lighting Network Analyzer.exe
          - os: macos-latest
            name: mac
            args: --mac --universal
            executable: desktop-dist/mac-universal/Lighting Network Analyzer.app/Contents/MacOS/Lighting Network Analyzer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run desktop:web
      - run: pnpm run desktop:test
      - run: pnpm exec electron-builder --config electron-builder.json ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check packaged app startup
        run: node scripts/smoke-desktop.mjs "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop-dist/*.exe
            desktop-dist/*.dmg
            desktop-dist/*.zip
            desktop-dist/*.blockmap
            desktop-dist/latest*.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-assets
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Lighting Network Analyzer $GITHUB_REF_NAME" --notes-file ../RELEASE_NOTES.md --draft
          gh release upload "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
