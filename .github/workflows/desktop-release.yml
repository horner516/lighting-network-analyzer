name: Mac Apple silicon installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: arm64
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: test "$(uname -m)" = arm64
      - run: pnpm install --frozen-lockfile
      - run: pnpm run desktop:web
      - run: pnpm run desktop:test
      - run: pnpm run mac:native
      - name: Check packaged server startup
        run: '"desktop-dist/Lux Link.app/Contents/Resources/node" "desktop-dist/Lux Link.app/Contents/Resources/server.cjs" "desktop-dist/Lux Link.app/Contents/Resources/dashboard" --smoke'
      - uses: actions/upload-artifact@v4
        with:
          name: lux-link-mac-arm64
          if-no-files-found: error
          path: desktop-dist/Lux-Link-*-mac-arm64.dmg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lux-link-mac-arm64
          path: release-assets
      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-assets
          sha256sum *.dmg > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Lux Link $GITHUB_REF_NAME" --notes-file ../RELEASE_NOTES.md --draft
          gh release upload "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
